<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>—</title>
<style>
  :root {
    --accent: #ff4d4d;
    --glow: rgba(255, 77, 77, 0.35);
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    background-color: #06080b;
    color: var(--accent);
    font-family: 'JetBrains Mono', 'Fira Code', 'IBM Plex Mono', 'Consolas', 'Courier New', monospace;
    overflow: hidden;
    transition: background-color 1.4s ease;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  /* лёгкая виньетка */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at 50% 45%, rgba(255,255,255,0.035), transparent 62%);
    pointer-events: none;
    z-index: 0;
  }

  /* едва заметная сетка */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
    background-size: 52px 52px;
    -webkit-mask-image: radial-gradient(ellipse at center, black 15%, transparent 72%);
    mask-image: radial-gradient(ellipse at center, black 15%, transparent 72%);
    pointer-events: none;
    z-index: 0;
  }

  .frame {
    position: relative;
    z-index: 1;
    padding: 52px 60px;
    border: 1px solid var(--accent);
    border-radius: 4px;
    background: rgba(0, 0, 0, 0.35);
    backdrop-filter: blur(2px);
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.02),
      0 0 70px var(--glow),
      inset 0 0 70px var(--glow);
    transition: border-color 1.4s ease, box-shadow 1.4s ease;
  }

  /* угловые насечки */
  .frame::before,
  .frame::after {
    content: '';
    position: absolute;
    width: 20px;
    height: 20px;
    border-color: var(--accent);
    border-style: solid;
    transition: border-color 1.4s ease;
    pointer-events: none;
  }
  .frame::before {
    top: -1px; left: -1px;
    border-width: 2px 0 0 2px;
  }
  .frame::after {
    bottom: -1px; right: -1px;
    border-width: 0 2px 2px 0;
  }

  .timer {
    display: flex;
    align-items: flex-start;
    justify-content: center;
    flex-wrap: wrap;
    gap: 8px 34px;
    color: var(--accent);
    text-shadow: 0 0 26px var(--glow), 0 0 64px var(--glow);
    transition: color 1.4s ease, text-shadow 1.4s ease;
    animation: breathe 4.5s ease-in-out infinite;
  }

  @keyframes breathe {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0.84; }
  }

  .unit {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .value {
    font-size: 82px;
    font-weight: 300;
    line-height: 1;
    letter-spacing: 0.02em;
    font-variant-numeric: tabular-nums;
  }

  .label {
    margin-top: 10px;
    font-size: 15px;
    font-weight: 400;
    letter-spacing: 0.06em;
    color: var(--accent);
    text-shadow: none;
    opacity: 0.7;
    transition: color 1.4s ease;
    white-space: nowrap;
  }

  @media (max-width: 760px) {
    .frame { padding: 34px 24px; }
    .timer { gap: 6px 20px; }
    .value { font-size: 48px; }
    .label { font-size: 11px; margin-top: 7px; }
  }

  @media (max-width: 460px) {
    .frame { padding: 24px 14px; }
    .value { font-size: 34px; }
    .label { font-size: 10px; letter-spacing: 0.04em; }
    .timer { gap: 4px 14px; }
  }
</style>
</head>
<body>

<div class="frame">
  <div class="timer" id="timer"></div>
</div>

<script>
  // ============================================================
  //  КОНСТАНТЫ
  // ============================================================

  // Начало отсчёта (18 октября 2026, 00:00)
  const TIMER_START = new Date('2026-10-18T00:00:00');

  // Конец: ровно через 11 недель (77 дней) в 18:00 → 3 января 2027, 18:00
  const TIMER_END = new Date('2027-01-03T18:00:00');

  // Фиксированное «сейчас» для проверки этапов.
  // null — живой таймер.
  const FIXED_NOW = null;
  // Например: new Date('2026-12-25T12:00:00')

  // ============================================================
  //  ЦВЕТА ЭТАПОВ
  // ============================================================

  const STAGE_COLORS = {
    red:    { c: '#ff4d4d', glow: 'rgba(255, 77, 77, 0.35)',  bg: '#120608' },
    orange: { c: '#ff9f43', glow: 'rgba(255, 159, 67, 0.35)', bg: '#120b06' },
    yellow: { c: '#f5c542', glow: 'rgba(245, 197, 66, 0.35)', bg: '#121006' },
    green:  { c: '#3ddc84', glow: 'rgba(61, 220, 132, 0.35)', bg: '#06120b' },
    blue:   { c: '#4a9eff', glow: 'rgba(74, 158, 255, 0.40)', bg: '#060c12' },
    cyan:   { c: '#5ee7ff', glow: 'rgba(94, 231, 255, 0.40)', bg: '#061214' }
  };

  // ============================================================
  //  СКЛОНЕНИЯ
  // ============================================================

  const PLURAL = {
    week:   ['неделя',  'недели',  'недель'],
    day:    ['день',    'дня',     'дней'],
    hour:   ['час',     'часа',    'часов'],
    minute: ['минута',  'минуты',  'минут'],
    second: ['секунда', 'секунды', 'секунд']
  };

  function plural(n, forms) {
    const a = Math.abs(n) % 100;
    const b = a % 10;
    if (a > 10 && a < 20) return forms[2];
    if (b === 1) return forms[0];
    if (b >= 2 && b <= 4) return forms[1];
    return forms[2];
  }

  // ============================================================
  //  ВСПОМОГАТЕЛЬНОЕ
  // ============================================================

  const timerEl = document.getElementById('timer');

  function getNow() {
    return FIXED_NOW ? new Date(FIXED_NOW) : new Date();
  }

  // ============================================================
  //  ЭТАП
  // ============================================================

  function getStage(now) {
    const remaining = TIMER_END - now;
    const elapsed   = now - TIMER_START;

    if (remaining <= 0)                  return 'cyan';
    if (remaining <= 12 * 3600 * 1000)   return 'blue';
    if (elapsed >= 9 * 7 * 86400 * 1000) return 'green';
    if (elapsed >= 7 * 7 * 86400 * 1000) return 'yellow';
    if (elapsed >= 3 * 7 * 86400 * 1000) return 'orange';
    return 'red';
  }

  let currentStage = '';

  function applyStage(stage) {
    if (stage === currentStage) return;
    currentStage = stage;
    const c = STAGE_COLORS[stage];
    document.documentElement.style.setProperty('--accent', c.c);
    document.documentElement.style.setProperty('--glow', c.glow);
    document.body.style.backgroundColor = c.bg;
  }

  // ============================================================
  //  ЛОГИКА ЕДИНИЦ
  // ============================================================

  function getUnits(remainingMs) {
    const totalSec = Math.max(0, Math.floor(remainingMs / 1000));

    const weeks      = Math.floor(totalSec / (7 * 86400));
    const daysComp   = Math.floor((totalSec % (7 * 86400)) / 86400);
    const daysTotal  = Math.floor(totalSec / 86400);
    const hoursTotal = Math.floor(totalSec / 3600);
    const hoursComp  = Math.floor((totalSec % 86400) / 3600);
    const minutes    = Math.floor((totalSec % 3600) / 60);
    const seconds    = totalSec % 60;

    // > 10 дней — недели + дни + часы
    if (totalSec > 10 * 86400) {
      return [
        { v: weeks,     f: plural(weeks,     PLURAL.week)   },
        { v: daysComp,  f: plural(daysComp,  PLURAL.day)    },
        { v: hoursComp, f: plural(hoursComp, PLURAL.hour)   }
      ];
    }

    // 3–10 дней — дни + часы
    if (totalSec > 3 * 86400) {
      return [
        { v: daysTotal, f: plural(daysTotal, PLURAL.day)    },
        { v: hoursComp, f: plural(hoursComp, PLURAL.hour)   }
      ];
    }

    // 12 часов – 3 дня — только часы
    if (totalSec > 12 * 3600) {
      return [
        { v: hoursTotal, f: plural(hoursTotal, PLURAL.hour) }
      ];
    }

    // ≤ 12 часов — часы + минуты + секунды
    return [
      { v: hoursTotal, f: plural(hoursTotal, PLURAL.hour)   },
      { v: minutes,    f: plural(minutes,    PLURAL.minute) },
      { v: seconds,    f: plural(seconds,    PLURAL.second) }
    ];
  }

  // Дополнение нулём — только для минут и секунд, и для часов, если они младше минут
  function displayValue(unit, allUnits) {
    const isMinOrSec = unit.f === PLURAL.minute[0] || unit.f === PLURAL.minute[1] || unit.f === PLURAL.minute[2] ||
                       unit.f === PLURAL.second[0] || unit.f === PLURAL.second[1] || unit.f === PLURAL.second[2];
    const isHourWithMin = unit.f === PLURAL.hour[0] || unit.f === PLURAL.hour[1] || unit.f === PLURAL.hour[2];
    const hasMinutes = allUnits.some(u => u.f === PLURAL.minute[0] || u.f === PLURAL.minute[1] || u.f === PLURAL.minute[2]);

    if (unit.v < 10 && (isMinOrSec || (isHourWithMin && hasMinutes))) {
      return '0' + unit.v;
    }
    return String(unit.v);
  }

  // ============================================================
  //  ОТРИСОВКА
  // ============================================================

  let currentLayout = '';

  function renderTimer(now) {
    const remaining = Math.max(0, TIMER_END - now);
    const units = getUnits(remaining);
    const layout = units.map(u => u.f).join('|');

    if (layout !== currentLayout) {
      currentLayout = layout;
      timerEl.innerHTML = units.map(u =>
        `<div class="unit">
           <div class="value">${displayValue(u, units)}</div>
           <div class="label">${u.f}</div>
         </div>`
      ).join('');
    } else {
      const valueEls = timerEl.querySelectorAll('.value');
      units.forEach((u, i) => {
        const el = valueEls[i];
        if (!el) return;
        const text = displayValue(u, units);
        if (el.textContent !== text) el.textContent = text;
      });
      const labelEls = timerEl.querySelectorAll('.label');
      units.forEach((u, i) => {
        const el = labelEls[i];
        if (el && el.textContent !== u.f) el.textContent = u.f;
      });
    }
  }

  // ============================================================
  //  ЦИКЛ
  // ============================================================

  function tick() {
    const now = getNow();
    applyStage(getStage(now));
    renderTimer(now);
  }

  tick();
  setInterval(tick, 200);
</script>

</body>
</html>
